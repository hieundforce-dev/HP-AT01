[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hpat"
version = "0.1.0"
description = "HP-AT01 - PMIC automated test software"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12,<1.0",
    "rich>=13.7,<14",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0,<7",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "matplotlib>=3.8,<4",
    "pyvisa>=1.14,<2",
    "ftd2xx>=1.3,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-mock>=3.14,<4",
    "ruff>=0.6,<1",
]

[project.scripts]
hpat = "hpat.cli:main"

[tool.setuptools.packages.find]
include = ["hpat*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["hpat", "tests"]
extend-exclude = ["docs", "runs", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer requires option/argument factories as default values.
"hpat/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
